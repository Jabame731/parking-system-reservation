<h1 class="mb-20">{{ reportTitle }}</h1>
<div class="">
  <ngx-charts-bar-vertical
    animate.enter="slide-in"
    [view]="view"
    [scheme]="colorScheme"
    [results]="single"
    [gradient]="gradient"
    [xAxis]="showXAxis"
    [yAxis]="showYAxis"
    [legend]="showLegend"
    [showXAxisLabel]="showXAxisLabel"
    [showYAxisLabel]="showYAxisLabel"
    [xAxisLabel]="xAxisLabel"
    [yAxisLabel]="yAxisLabel"
    (select)="onSelect($event)"
  >
  </ngx-charts-bar-vertical>
</div>

<div class="mt-20 grow grid grid-cols-3 auto-rows-fr rounded overflow-hidden">
  <!-- Revenue Card -->
  <app-parking-card-status
    [cardTitle]="'Today’s Revenue'"
    [cardCount]="4500"
    [bgColor]="'bg-primary'"
    [cardIcon]="'money_range'"
  >
  </app-parking-card-status>

  <!-- Revenue Card -->
  <app-parking-card-status
    [cardTitle]="'Total Parkings Today'"
    [cardCount]="128"
    [bgColor]="'bg-accent-700'"
    [cardIcon]="'directions_car'"
  >
  </app-parking-card-status>

  <!-- Revenue Card -->
  <app-parking-card-status
    [cardTitle]="'Peak Hour'"
    [cardCount]="'6:00 PM – 7:00 PM'"
    [bgColor]="'bg-gray-700'"
    [cardIcon]="'show_chart'"
  >
  </app-parking-card-status>

  <!-- Revenue Card -->
  <app-parking-card-status
    [cardTitle]="'Current Occupancy'"
    [cardCount]="'85%'"
    [bgColor]="'bg-primary-800'"
    [cardIcon]="'groups'"
  >
  </app-parking-card-status>
</div>

<ng-container *cdkPortal>
  <div class="items-center">
    <span>Good Morning John</span>
  </div>
</ng-container>
